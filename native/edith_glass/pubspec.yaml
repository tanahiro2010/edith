name: edith_glass
description: "E.D.I.T.H — Halo スマートグラス用クライアント（HUD/カメラ/音声のホストアプリ）。"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  # 実カメラ（iOS / Web=getUserMedia / Android）。macOSデスクトップは非対応→アセットに fallback。
  camera: ^0.11.0
  # Web の DOM/プラットフォームビュー登録（MediaPipe クライアント検出用）
  web: ^1.1.0
  # 多人数識別のため、フレームから顔領域を切り出す（純Dart・全プラットフォーム）
  image: ^4.3.0
  # 端末マイクのオンデバイス音声認識（iOS ネイティブ STT）→ テキスト指示へ
  speech_to_text: ^7.0.0
  # バックエンド接続先（ホストIP等）を端末に保存
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
